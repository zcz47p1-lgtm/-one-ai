<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101322"><title>One AI</title><link rel="stylesheet" href="/styles.css"></head><body><main class="app"><header class="topbar"><div class="brand"><span class="logo">✦</span><span>One AI</span></div><span class="pill">AI Assistant</span></header><section class="welcome" id="welcome"><div class="hero-icon">✦</div><h1>What can I help with?</h1><p>Ask a question, learn something new, or brainstorm an idea.</p><div class="suggestions"><button class="suggestion" data-prompt="Explain artificial intelligence in simple words">Explain AI simply</button><button class="suggestion" data-prompt="Help me improve my English speaking">Practice English</button><button class="suggestion" data-prompt="Give me a realistic daily study plan">Make a study plan</button></div></section><section id="chat" class="chat" aria-live="polite"></section><form id="chat-form" class="composer"><textarea id="message" rows="1" maxlength="6000" placeholder="Message One AI..." aria-label="Your message" required></textarea><button id="send" type="submit" aria-label="Send message">↑</button></form><p class="footnote">AI can make mistakes. Don't share passwords or private information.</p></main><script src="/app.js"></script></body></html>
